    (function () {
      var v = document.getElementById('v'), bar = document.getElementById('bar'), IDLE = 45000;
      var play = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
      v.muted = true;
      v.addEventListener('canplay', function () { if (!live) play(); });

      // 영상은 통째로 받아 메모리에서 튼다 — 받아 둔 사본(Cache)이 있으면 네트워크를 쓰지 않는다. 처음 한 번만 조각을 차례로 받고, 왼쪽 아래 작은 숫자로 진행을 보인다

      var get = function (url, c) {

      };

      // 화면 꺼짐 막기(자동 잠금 '안 함'과 함께 쓴다)

      // 혼자 도는 동안의 안전 장치 — 멈추면 다시 틀고, 그래도 안 되면 새로 연다
